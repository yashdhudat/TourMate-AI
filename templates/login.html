<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PersonaTrip — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="page-wrapper">

  <!-- ── Navbar ── -->
  <nav class="navbar">
    <a class="navbar-brand" href="/">Persona<span>Trip</span></a>
    <a href="/">Home</a>
    <a href="/login" style="color:var(--gold);">Login</a>
    <a href="/register">Register</a>
  </nav>

  <!-- ── Main ── -->
  <main class="main-content">
    <div class="container" style="max-width: 460px;">

      <!-- Logo mark -->
      <div class="auth-logo">
        <div class="auth-logo-mark">🔐</div>
        <h2 style="margin-top: 0;">Welcome Back</h2>
        <p class="subtitle" style="margin-bottom: 0;">Sign in to continue your journey</p>
      </div>

      <div class="auth-divider"></div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <li class="flash-message {% if cat == 'error' %}error{% endif %}" style="margin-bottom:20px;">{{ msg }}</li>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <!-- Form -->
      <form method="POST">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 28px;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <input type="submit" value="Login to PersonaTrip →">
      </form>

      <p class="helper-text">
        Don't have an account? <a href="/register">Create one here</a>
      </p>

    </div>
  </main>

</div>
</body>
</html>
